# NLR pilot-plant stirred tank.
#
# Geometry values are literal physical dimensions in geometry.units.
# The lower and upper impellers are independently specified.
#
# MRF topology and MRF activity are intentionally separate:
#
#   mesh.mrf_mesh_vertical_buffer_cells
#       broad blockMesh rotor envelope
#
#   mrf.vertical_buffer_cells
#       active rotating zone selected inside that envelope

geometry:
    units: "in"

    tank:
        diameter:        42.0
        height:          68.525
        bottom_z:        0.0
        round_bottom:    true
        bottom_inlet:    false
        aspect_ratio:    null
        target_volume_L: null

    shaft:
        radius: 1.0

    baffles:
        count: 4
        width: 3.45

    impellers:
        - name: lower
          center_z: 10.375
          tip_diameter: 18.0
          hub_height: 0.9
          blades:
              count: 6
              axial_width: 3.6
              radial_length: 4.5
              inner_radial_length: 0.20
              pitch_deg: 0.0

        - name: upper
          center_z: 32.375
          tip_diameter: 22.0
          hub_height: 0.9
          blades:
              count: 4
              axial_width: 8.485
              radial_length: 6.25
              inner_radial_length: 0.20
              pitch_deg: 45.0

mesh:
    nr: 2
    nz: 2
    n_poly: 2
    n_azimuth: 2

    # Broad mesh envelope. This must not be interpreted as the
    # physically active MRF extent.
    mrf_mesh_vertical_buffer_cells: 6
    mrf_radial_buffer_cells: 6

mrf:
    parent_zone: rotorEnvelope
    cell_zone: rotor

    # Validated V3 active axial buffer.
    vertical_buffer_cells: 3

    origin: [0, 0, 0]
    axis: [0, 1, 0]

    # +17.38 rad/s ~= 166 rpm; upper 45-degree blade geometry is
    # down-pumping with this rotation direction.
    omega_rad_s: 17.38
    ramp_time_s: 0.10
    hold_until_s: 10.0

    nonRotatingPatches: []
