# NLR pilot-plant stirred tank.
#
# Geometry values are literal physical dimensions in geometry.units.
# The lower and upper impellers are independently specified.
#
# MRF topology and MRF activity are intentionally separate:
#
#   mesh.mrf_mesh_vertical_buffer_cells
#       broad blockMesh rotor envelope
#
#   mrf.vertical_buffer_cells
#       active rotating zone selected inside that envelope, counted in
#       mesh layers beyond the blade edges (mrf_zone_from_yaml.py reads
#       the layer planes from the mesh, so the zone ends on cell faces)

geometry:
    units: "in"

    tank:
        diameter:        42.0
        height:          68.525
        bottom_z:        0.0
        round_bottom:    true
        bottom_inlet:    false
        aspect_ratio:    null
        target_volume_L: null

    shaft:
        radius: 1.0

    baffles:
        count: 4
        width: 3.45

    impellers:
        - name: lower
          center_z: 10.375
          tip_diameter: 18.0
          hub_height: 0.9
          blades:
              count: 6
              axial_width: 3.6
              radial_length: 4.5
              inner_radial_length: 0.20
              pitch_deg: 0.0

        - name: upper
          center_z: 32.375
          tip_diameter: 22.0
          hub_height: 0.9
          blades:
              count: 4
              axial_width: 8.485
              radial_length: 6.25
              inner_radial_length: 0.20
              pitch_deg: 45.0

mesh:
    nr: 2
    nz: 2
    n_poly: 2
    n_azimuth: 2

    # Broad mesh envelope. This must not be interpreted as the
    # physically active MRF extent.
    mrf_mesh_vertical_buffer_cells: 6
    mrf_radial_buffer_cells: 6

    # Below the first hub the axis is fluid. square_core: true meshes the
    # shaft-radius disc there with a square of hex blocks plus one ring,
    # instead of the fan of wedge cells with one edge on the axis.
    # square_core_fraction is the square's half-width over the shaft
    # radius (corners at fraction * sqrt(2), so below 1/sqrt(2)).
    square_core: false
    square_core_fraction: 0.55

mrf:
    parent_zone: rotorEnvelope
    cell_zone: rotor

    # Validated V3 active axial buffer.
    vertical_buffer_cells: 3

    origin: [0, 0, 0]
    axis: [0, 1, 0]

    # +17.38 rad/s ~= 166 rpm; upper 45-degree blade geometry is
    # down-pumping with this rotation direction.
    omega_rad_s: 17.38
    ramp_time_s: 0.10
    hold_until_s: 10.0

    nonRotatingPatches: []
